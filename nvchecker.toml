# pinned manually: swift-6.2-bin follows luma's upstream SWIFT_VERSION pin
# and frida-core follows luma's FRIDA_CORE_REF (see luma/PKGBUILD) — bump
# both together with luma, to that release's CI pins.
[frida-core]
source = "manual"
manual = "17.15.4"

[swift-6.2-bin]
source = "manual"
manual = "6.2"

# ---- GitHub: Swift releases (swift-<version>-RELEASE tags) -------------------
[swift-bin]
source = "github"
github = "apple/swift"
use_max_tag = true
# apple/swift also tags snapshots and unrelated components; keep plain
# swift-X.Y(.Z)-RELEASE tags. Download paths use the version verbatim in
# both the directory and filename, so a plain pkgver rewrite finds the file.
include_regex = '^swift-\d+\.\d+(\.\d+)?-RELEASE$'
prefix = "swift-"
suffix = "-RELEASE"

# ---- npm --------------------------------------------------------------------
[obsidian-headless-bin]
source = "npm"
npm = "obsidian-headless"

[playwright-cli]
source = "npm"
npm = "@playwright/cli"

# ---- GitLab -----------------------------------------------------------------
[nrf-connect-sdk-installer]
source = "gitlab"
gitlab = "hellesvik/nrf-connect-sdk-installer"
use_max_tag = true
prefix = "v"

# ---- JetBrains (no native source; query the public releases API) ------------
[clion]
source = "cmd"
cmd = "curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=CL&latest=true&type=release' | jq -r '.CL[0].version'"

[datagrip]
source = "cmd"
cmd = "curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=DG&latest=true&type=release' | jq -r '.DG[0].version'"

[dataspell]
