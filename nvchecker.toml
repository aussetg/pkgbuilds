[__config__]
oldver = "old.json"
newver = "new.json"
# GitHub token lives in this gitignored keyfile (see keyfile.toml.example).
# Create it once:  printf '[keys]\n"github.com" = "ghp_<classic-pat>"\n' > keyfile.toml
# update-all.py also writes it from NVCHECKER_GITHUB_TOKEN/GITHUB_TOKEN.
keyfile = "keyfile.toml"

# =============================================================================
# nvchecker sources for every package in this repository (except arcana-git,
# which is built from a local upstream and intentionally untracked).
#
# Source types used:
#   github  — upstream GitHub releases/tags
#   pypi    — Python packages
#   npm     — npm registry
#   gitlab  — upstream GitLab tags
#   cmd     — shell command (used for JetBrains, which has no native source)
#   aur     — AUR package version. Used only for proprietary upstreams that
#             expose no public version feed (Crossover, NoMachine, VueScan,
#             WinBox, Nordic tools, Sublime Merge, J-Link, STM32CubeMX). The AUR
#             version is a freshness signal, not a recipe refresh; the strip
#             pattern below removes the leading epoch and trailing pkgrel so
#             only the bare pkgver is recorded.
#   regex   — parse a directory listing (EDK2 Fedora koji).
#   manual  — no discoverable upstream version. Login/license-gated downloads,
#             commit-pinned VCS packages, frozen legacy lines, nightly/curated
#             builds, and packages whose pkgver is coupled to extra metadata
#             nvchecker cannot resolve. Bump these by hand; nvchecker will never
#             report a delta for them.
#
# Every key equals its package directory name, since update-all.py passes that
# name to .github/scripts/update-package.sh.
# =============================================================================

# ---- GitHub: releases with a "v" prefix -------------------------------------
[luma-bin]
source = "github"
github = "frida/luma"
use_max_tag = true
# The repo also tags QEMU builds and other side releases; keep plain semver
# tags, and note the release assets embed the distro name — bumps need the
# .deb URL re-checked against the newest release's asset list.
include_regex = '^\d+\.\d+\.\d+$'

[archlinux-java-run]
source = "github"
github = "michaellass/archlinux-java-run"
use_max_tag = true
prefix = "v"

[atuin-desktop-bin]
source = "github"
github = "atuinsh/desktop"
use_latest_release = true
prefix = "v"

[bunny-cli-bin]
source = "github"
github = "BunnyWay/cli"
use_latest_release = true
prefix = "v"

[colgrep]
