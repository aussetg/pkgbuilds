# ---- GitHub: tag without "v" prefix, or tag filtering needed ----------------
[detect-it-easy]
# Tags are bare X.Y. The Arch asset name embeds upstream's own pkgrel
# (detect-it-easy-<ver>-1-x86_64.pkg.tar.zst); re-check the asset list on
# each bump. die/diec/diel link Qt5Script, AUR-only on stock Arch.
source = "github"
github = "horsicq/DIE-engine"
use_latest_release = true

[libudev0-shim]
source = "github"
github = "archlinux/libudev0-shim"
use_max_tag = true
prefix = "v"

[pandoc-bin]
source = "github"
github = "jgm/pandoc"
use_latest_release = true

[pico-sdk]
source = "github"
github = "raspberrypi/pico-sdk"
use_max_tag = true
include_regex = '^\d+\.\d+\.\d+$'

[picotool]
# PKGBUILD derives pkgver from the tag with dashes -> dots.
source = "github"
github = "raspberrypi/picotool"
use_latest_release = true
from_pattern = '-'
to_pattern = '.'

[rr]
# Tags are bare X.Y.Z; keep the include_regex as a guard against stray tags
# (e.g. target-wine-*). 5.9.0 carries two local patches (termio build fix,
# Strix Halo CPU id) — both landed on master, so drop them on the 5.10 bump.
source = "github"
github = "rr-debugger/rr"
use_max_tag = true
include_regex = '^\d+\.\d+\.\d+$'

[oss-cad-suite-build-bin]
# Release tags are dates (YYYY-MM-DD); pkgver strips the dashes.
source = "github"
github = "YosysHQ/oss-cad-suite-build"
use_latest_release = true
from_pattern = '(\d{4})-(\d{2})-(\d{2})'
to_pattern = '\1\2\3'

["llama.cpp-gfx1151"]
# Upstream tags builds as bNNNN (and also master-<hash>); keep only bNNNN.
source = "github"
github = "ggml-org/llama.cpp"
use_max_tag = true
include_regex = '^b\d+$'

[hipfort-gfx1151]
# Track ROCm release tags (rocm-X.Y.Z), ignoring the date-based dev tags.
source = "github"
github = "ROCm/hipfort"
use_max_tag = true
include_regex = 'rocm-\d+\.\d+\.\d+'
prefix = "rocm-"

[rocm-gfx1151-bin]
source = "github"
github = "ROCm/ROCm"
use_max_tag = true
include_regex = 'rocm-\d+\.\d+\.\d+'
prefix = "rocm-"

