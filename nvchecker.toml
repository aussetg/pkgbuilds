source = "cmd"
cmd = "curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=PCP&latest=true&type=release' | jq -r '.PCP[0].version'"

[rustrover]
source = "cmd"
cmd = "curl -fsSL 'https://data.services.jetbrains.com/products/releases?code=RR&latest=true&type=release' | jq -r '.RR[0].version'"

